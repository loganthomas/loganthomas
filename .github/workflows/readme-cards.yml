# Generate the stats cards here and commit them,
# so the profile README never depends on a rate-limited public stats server.
name: Update README cards

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
  # Regenerate right away when card options change.
  push:
    branches: [main]
    paths: [.github/workflows/readme-cards.yml]

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    env:
      # Optional PAT (repo + read:user) adds private contributions; GITHUB_TOKEN covers public only.
      STATS_TOKEN: ${{ secrets.README_STATS_TOKEN || secrets.GITHUB_TOKEN }}
      CARD_STYLE: theme=transparent&hide_border=true
    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=loganthomas&show_icons=true&count_private=true&include_all_commits=true&rank_icon=percentile&hide_title=true&${{ env.CARD_STYLE }}
          path: profile/stats.svg
          token: ${{ env.STATS_TOKEN }}
          # Keep yesterday's card instead of committing an error card.
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=loganthomas&layout=compact&hide=Jupyter Notebook,HTML,Vim Script&langs_count=10&hide_title=true&${{ env.CARD_STYLE }}
          path: profile/top-langs.svg
          token: ${{ env.STATS_TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
